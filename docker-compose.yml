networks:
  food-delivery-net:
    driver: bridge

volumes:
  mysql-data:

services:

  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fd-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [food-delivery-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fd-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [food-delivery-net]

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fd-kafka-topics-init
    depends_on: [kafka]
    networks: [food-delivery-net]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..." &&
        cub kafka-ready -b kafka:29092 1 60 &&
        for topic in orders.created orders.status.updated payments.completed payments.failed kitchen.status.updated delivery.assigned delivery.completed; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
        done &&
        echo "Kafka topics created."

  mysql:
    image: mysql:8.0
    container_name: fd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [food-delivery-net]

  # ---------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------

  # Every service's `configurable` variables (see Config.toml in each folder)
  # are overridden here for the container network using Ballerina's env-var
  # override convention: BAL_<CONFIGURABLE_NAME_UPPERCASED>.
  customer-service:
    build: ./customer-service
    container_name: fd-customer-service
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      kafka-topics-init: {condition: service_completed_successfully}
    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: fooddelivery
      BAL_CONFIG_VAR_DBPASSWORD: fooddelivery_pw
      BAL_CONFIG_VAR_DBNAME: customer_db
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_SERVICEPORT: 8081
    ports: ["8081:8081"]
    networks: [food-delivery-net]

  restaurant-service:
    build: ./restaurant-service
    container_name: fd-restaurant-service
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      kafka-topics-init: {condition: service_completed_successfully}
    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: fooddelivery
      BAL_CONFIG_VAR_DBPASSWORD: fooddelivery_pw
      BAL_CONFIG_VAR_DBNAME: restaurant_db
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_SERVICEPORT: 8082
    ports: ["8082:8082"]
    networks: [food-delivery-net]

  order-service:
    build: ./order-service
    container_name: fd-order-service
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      kafka-topics-init: {condition: service_completed_successfully}
    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: fooddelivery
      BAL_CONFIG_VAR_DBPASSWORD: fooddelivery_pw
      BAL_CONFIG_VAR_DBNAME: order_db
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_SERVICEPORT: 8083
    ports: ["8083:8083"]
    networks: [food-delivery-net]

  payment-service:
    build: ./payment-service
    container_name: fd-payment-service
    restart: unless-stopped
